<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سلمى الغريبي | طالبة هندسة حاسب</title>
  <meta name="description" content="الموقع الشخصي لسلمى الغريبي، طالبة هندسة حاسب في جامعة الطائف. مشاريع ومشاركات ومهارات.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="nav">
    <div class="wrap nav-in">
      <a class="brand" href="#top" id="brand"></a>
      <nav id="links" aria-label="الأقسام"></nav>
      <div class="socials" id="socials"></div>
      <a class="btn btn-sm" href="#contact">تواصل معي</a>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap">
        <p class="tag"><span dir="ltr">//</span> <span id="role"></span></p>
        <h1><span class="hello">مرحبًا، أنا</span><span class="name" id="name"></span></h1>
        <p class="intro" id="intro"></p>
        <div class="actions">
          <a class="btn" href="#works">استعرض أعمالي</a>
          <a class="btn btn-ghost" href="#contact">تواصل معي</a>
        </div>
      </div>
    </section>

    <section id="about">
      <div class="wrap narrow">
        <p class="tag" dir="ltr">// about</p>
        <h2>من أنا؟</h2>
        <p class="lead" id="about-text"></p>
      </div>
    </section>

    <section id="works" class="alt">
      <div class="wrap">
        <p class="tag" dir="ltr">// works</p>
        <h2>أعمالي</h2>
        <article class="card feature" id="featured"></article>
        <div class="grid2" id="more-works"></div>
      </div>
    </section>

    <section id="activities">
      <div class="wrap narrow">
        <p class="tag" dir="ltr">// activities</p>
        <h2>مشاركاتي</h2>
        <ul class="timeline" id="timeline"></ul>
      </div>
    </section>

    <section id="skills" class="alt">
      <div class="wrap">
        <p class="tag" dir="ltr">// skills</p>
        <h2>مهاراتي</h2>
        <div class="skills" id="skill-groups"></div>
      </div>
    </section>

    <section id="contact">
      <div class="wrap">
        <div class="panel">
          <h2>لنبنِ شيئًا معًا</h2>
          <p class="lead">إذا كان لديك مشروع أو فعالية أو فرصة للتعاون، يسعدني التواصل معك.</p>
          <div id="mail-btn"></div>
          <p class="mail" dir="ltr" id="mail"></p>
        </div>
      </div>
    </section>
  </main>

  <footer><div class="wrap" id="footer"></div></footer>

  <script src="script.js"></script>
</body>
</html>
